<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 640" width="1460" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Agentic OS — how knowledge moves"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#16a34a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#94a3b8"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect width="1460" height="640" fill="#ffffff"/><text x="40" y="46" font-size="27" font-weight="800" fill="#0f172a">Agentic OS — how knowledge moves</text><text x="41" y="72" font-size="15" fill="#64748b">Capture is easy, so curation is scheduled and a human gates only the last step. The next session starts already knowing all of it.</text><text x="40" y="118" font-size="13" font-weight="700" fill="#2563eb">EXPLICIT · you say it</text><rect x="60" y="132" width="250" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="185.0" y="161.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">you + the assistant</text><text x="185.0" y="178.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">in a session</text><rect x="430" y="120" width="250" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="555.0" y="143.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">&quot;remember this&quot;</text><text x="555.0" y="160.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">short fact</text><rect x="760" y="120" width="290" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="905.0" y="143.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Mem0</text><text x="905.0" y="160.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">auto-recalled next session</text><rect x="430" y="196" width="250" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="555.0" y="219.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">&quot;ingest&quot; / &quot;file this&quot;</text><text x="555.0" y="236.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">url · video · pdf</text><polyline points="310,150 430,147" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><polyline points="680,147 760,147" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><polyline points="310,170 430,223" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="1110" y="120" width="300" height="180" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="1260.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">THE WIKI</text><text x="1260.0" y="198.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">~/brain · git + Obsidian</text><text x="1260.0" y="215.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">one note per topic</text><text x="1260.0" y="232.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">index.md is the map</text><text x="1260.0" y="249.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">syncs to GitHub</text><polyline points="680,223 1110,210" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="781.1" y="195" width="227.79999999999998" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="895" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16a34a">trusted — straight to the library</text><text x="40" y="350" font-size="13" font-weight="700" fill="#b45309">AUTOMATIC · happens anyway</text><rect x="60" y="364" width="250" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="185.0" y="393.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">session observer</text><text x="185.0" y="410.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">records what each session did</text><rect x="430" y="364" width="250" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="555.0" y="393.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">weekly job (Mon 09:00)</text><text x="555.0" y="410.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mines the week -&gt; drafts</text><rect x="760" y="364" width="290" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="905.0" y="385.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">INBOX</text><text x="905.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">wiki/inbox · status: draft</text><text x="905.0" y="419.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">nothing here is trusted yet</text><polyline points="310,397 430,397" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#agr)"/><polyline points="680,397 760,397" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#agr)"/><rect x="1110" y="360" width="300" height="74" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="1260.0" y="393.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">you: &quot;promote the inbox&quot;</text><text x="1260.0" y="410.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">verify-&gt;merge-&gt;fix links-&gt;index-&gt;sync</text><polyline points="1050,397 1110,397" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><polyline points="1260,360 1260,300" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="1212.1" y="322" width="95.8" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="1260" y="335" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16a34a">into the wiki</text><polyline points="900,430 900,480" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="779.5" y="490" width="241.0" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="900" y="503" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626">reject = delete (git keeps history)</text><polyline points="1410,290 1435,290 1435,600 40,600 40,165 60,165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="517.0" y="578" width="406.0" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="720" y="591" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2563eb">RECALL · the next session starts already knowing all of this</text><text x="1110" y="322" font-size="11.5" fill="#64748b">"lint the brain" finds contradictions, dupes, thin notes</text></svg>