<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 560" width="1460" height="560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Agentic OS - how it knows it&#x27;s working"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#16a34a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#94a3b8"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect width="1460" height="560" fill="#ffffff"/><text x="40" y="46" font-size="27" font-weight="800" fill="#0f172a">Agentic OS - how it knows it&#x27;s working</text><text x="41" y="72" font-size="15" fill="#64748b">The cloud agents can only draft. The merge is the acceptance event, and the dashboard tracks whether the whole thing is paying off.</text><rect x="60" y="150" width="230" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="175.0" y="179.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">cloud agents</text><text x="175.0" y="196.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">draft only</text><rect x="350" y="150" width="200" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="450.0" y="179.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">pull request</text><text x="450.0" y="196.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">waits for review</text><rect x="610" y="150" width="260" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="740.0" y="179.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">you review + merge</text><text x="740.0" y="196.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#15803d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the acceptance event</text><polyline points="290,183 350,183" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#agr)"/><polyline points="550,183 610,183" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#agr)"/><polyline points="870,183 940,183" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="940" y="120" width="460" height="210" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="1170.0" y="196.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">AGENTIC OS dashboard  :8899</text><text x="1170.0" y="213.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">acceptance = merged / resolved drafts</text><text x="1170.0" y="230.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">cost per accepted note = $11.98 lifetime</text><text x="1170.0" y="247.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">metered daily since early July</text><text x="1170.0" y="264.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">unresolved metrics show &quot;-&quot;, never a green 0</text><rect x="940" y="372" width="300" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#sh)"/><text x="1090.0" y="398.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">ntfy</text><text x="1090.0" y="415.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">alerts: job failed · funnel leak &gt;7d</text><polyline points="1090,330 1090,372" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="1125.2" y="342" width="49.599999999999994" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="1150" y="355" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626">alerts</text><polyline points="1380,330 1380,490 175,490 175,216" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="603.2" y="468" width="313.59999999999997" height="18" rx="4" fill="#ffffff" opacity="0.95"/><text x="760" y="481" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2563eb">the numbers steer what the agents do next week</text><text x="60" y="534" font-size="12.5" fill="#64748b">Collectors are read-only, and the scope of anything an agent sends comes from your request, never from a page it fetched.</text></svg>